<svg xmlns="http://www.w3.org/2000/svg" width="920" height="424" viewBox="0 0 920 424">
<rect width="920" height="424" rx="10" fill="#1e1e1e"/>
<circle cx="20" cy="18" r="6" fill="#ff5f57"/><circle cx="40" cy="18" r="6" fill="#febc2e"/><circle cx="60" cy="18" r="6" fill="#28c840"/>
<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" xml:space="preserve" style="white-space:pre">
<text x="20" y="56" xml:space="preserve"><tspan fill="#7a7a7a">$ </tspan><tspan fill="#ffffff" font-weight="bold">storage-rm</tspan></text>
<text x="20" y="76" xml:space="preserve"><tspan fill="#4fc1ff">==&gt;</tspan><tspan fill="#d4d4d4"> Scanning (nothing is deleted)…</tspan></text>
<text x="20" y="96" xml:space="preserve"></text>
<text x="20" y="116" xml:space="preserve"><tspan fill="#ffffff" font-weight="bold">  CATEGORY            SIZE  WHAT</tspan></text>
<text x="20" y="136" xml:space="preserve"><tspan fill="#d4d4d4">  docker             40.1G  </tspan><tspan fill="#7a7a7a">Docker build cache + dangling images (containers and volumes kept)</tspan></text>
<text x="20" y="156" xml:space="preserve"><tspan fill="#d4d4d4">  xcode              12.3G  </tspan><tspan fill="#7a7a7a">Xcode DerivedData, older iOS DeviceSupport, simulator caches</tspan></text>
<text x="20" y="176" xml:space="preserve"><tspan fill="#d4d4d4">  gradle              6.9G  </tspan><tspan fill="#7a7a7a">Gradle caches, daemon logs, old wrapper distributions</tspan></text>
<text x="20" y="196" xml:space="preserve"><tspan fill="#d4d4d4">  npm                 3.8G  </tspan><tspan fill="#7a7a7a">npm cache and npx cache</tspan></text>
<text x="20" y="216" xml:space="preserve"><tspan fill="#d4d4d4">  pnpm                1.7G  </tspan><tspan fill="#7a7a7a">pnpm content store</tspan></text>
<text x="20" y="236" xml:space="preserve"><tspan fill="#d4d4d4">  brew              291.0M  </tspan><tspan fill="#7a7a7a">Homebrew download cache and old versions</tspan></text>
<text x="20" y="256" xml:space="preserve"><tspan fill="#d4d4d4">  app-caches          8.9G  </tspan><tspan fill="#7a7a7a">App caches: Spotify, browsers, VS Code, Cursor, Slack, …</tspan></text>
<text x="20" y="276" xml:space="preserve"><tspan fill="#d4d4d4">  claude              2.6G  </tspan><tspan fill="#7a7a7a">Claude desktop simulator builds</tspan></text>
<text x="20" y="296" xml:space="preserve"><tspan fill="#e5c07b">  opt-in</tspan></text>
<text x="20" y="316" xml:space="preserve"><tspan fill="#d4d4d4">  android-avd        10.6G  </tspan><tspan fill="#7a7a7a">Android emulators (AVDs) and SDK system images</tspan></text>
<text x="20" y="336" xml:space="preserve"><tspan fill="#d4d4d4">  node-modules        3.1G  </tspan><tspan fill="#7a7a7a">node_modules in projects untouched for --days</tspan></text>
<text x="20" y="356" xml:space="preserve"></text>
<text x="20" y="376" xml:space="preserve"><tspan fill="#d4d4d4">  </tspan><tspan fill="#ffffff" font-weight="bold">clean</tspan><tspan fill="#d4d4d4"> would free about </tspan><tspan fill="#6ad07a">77.1G</tspan><tspan fill="#d4d4d4"> — 573.2G available now</tspan></text>
<text x="20" y="396" xml:space="preserve"><tspan fill="#d4d4d4">  opt-in categories hold another </tspan><tspan fill="#e5c07b">13.7G</tspan><tspan fill="#d4d4d4"> (use -o name or --all)</tspan></text>
</g>
</svg>
