name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck storage-rm install.sh

  smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax (stock bash 3.2)
        run: /bin/bash -n storage-rm
      - name: Help, list, version
        run: |
          ./storage-rm --help
          ./storage-rm list
          ./storage-rm --version
      - name: Scan
        run: ./storage-rm scan --all
      - name: JSON scan is valid
        run: ./storage-rm scan --json | python3 -m json.tool
      - name: Dry-run clean deletes nothing
        run: |
          before=$(find ~/Library/Caches | wc -l)
          ./storage-rm clean -n --all
          after=$(find ~/Library/Caches | wc -l)
          test "$before" -eq "$after"
      - name: Rejects unknown category
        run: "! ./storage-rm clean -o nope"
      - name: Refuses to run unattended without -y
        run: "! ./storage-rm clean -o npm < /dev/null"
      - name: Install
        run: PREFIX="$RUNNER_TEMP" ./install.sh && "$RUNNER_TEMP/bin/storage-rm" --version
